name: Tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["depot-ubuntu-24.04","depot-macos-latest","depot-windows-2025"]' || '["depot-ubuntu-24.04"]') }}
        go: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["1.25.x","1.27.x"]' || '["1.27.x"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./... -count=1
        env:
          CGO_ENABLED: '0'
  race:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.x'
      - run: go test -race -gcflags=all=-d=checkptr=2 ./... -count=1
        env:
          GOGC: '10'
